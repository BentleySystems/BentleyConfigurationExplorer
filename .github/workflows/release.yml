name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found on the runner."
          }
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH WorkspaceCFG.sln /restore /p:Configuration=Release /p:Platform=x64

      - name: Publish
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH WorkspaceCFG\WorkspaceCFG.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishProfile=WorkspaceCFG\Properties\PublishProfiles\FolderProfile.pubxml

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path WorkspaceCFG\bin\Release\Publish\* -DestinationPath ConfigurationExplorer-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ConfigurationExplorer-win-x64.zip --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
